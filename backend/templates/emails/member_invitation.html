{% comment %}
Member-invitation email.  Email clients strip <style> unevenly, so
every rule is inline and the palette is the `duty` theme's paper/ink/navy
written out literally — CSS custom properties do not survive here.
{% endcomment %}<!doctype html>
<html lang="en">
  <body
    style="margin: 0; padding: 24px 0; background: #eef2f7; color: #1d2530;
           font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
           font-size: 16px; line-height: 1.55;"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
      <tr>
        <td align="center" style="padding: 0 16px;">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 34rem; border-collapse: collapse; background: #ffffff;
                   border: 1px solid #ccd6e1; border-radius: 2px;"
          >
            <tr>
              <td style="padding: 28px 32px 20px; border-bottom: 1px solid #ccd6e1;">
                <p
                  style="margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
                         text-transform: uppercase; color: #55606d;"
                >
                  {{ org_name }}
                </p>
                <h1
                  style="margin: 0; font-family: Fraunces, Georgia, 'Times New Roman', serif;
                         font-size: 26px; font-weight: 600; line-height: 1.2; color: #1d2530;"
                >
                  Set your password
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 32px 8px;">
                <p style="margin: 0 0 16px;">Hello{% if first_name %} {{ first_name }}{% endif %},</p>
                <p style="margin: 0 0 16px;">
                  An account has been created for you at {{ org_name }}, registered to
                  <strong>{{ user.email }}</strong>. Choose a password to finish setting it up:
                </p>
                <p style="margin: 0 0 20px;">
                  <a
                    href="{{ reset_url }}"
                    style="display: inline-block; padding: 10px 20px; background: #1f4e79; color: #ffffff;
                           border: 1px solid #1f4e79; border-radius: 2px; font-size: 14px;
                           font-weight: 500; text-decoration: none;"
                    >Choose a password</a
                  >
                </p>
                <p style="margin: 0 0 16px; font-size: 14px; color: #55606d;">
                  The link can be used once and expires in {{ expiry_days }} day{{ expiry_days|pluralize }}. If the
                  button does not work, paste this address into your browser:
                </p>
                <p
                  style="margin: 0 0 20px; font-family: 'IBM Plex Mono', Menlo, Consolas, monospace;
                         font-size: 13px; word-break: break-all;"
                >
                  <a href="{{ reset_url }}" style="color: #1f4e79;">{{ reset_url }}</a>
                </p>
                <p style="margin: 0 0 8px; font-size: 14px; color: #55606d;">
                  If you were not expecting this you can ignore this message — no account of yours
                  changes until the link is used.{% if contact_email %}
                  Anything that looks wrong, write to
                  <a href="mailto:{{ contact_email }}" style="color: #1f4e79;">{{ contact_email }}</a>.{% endif %}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 32px 24px; border-top: 1px solid #ccd6e1;">
                <p style="margin: 0; font-size: 13px; color: #55606d;">
                  {{ org_name }} ·
                  <a href="{{ site_url }}" style="color: #1f4e79;">{{ site_url }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
