# The existing site `make rehearse-deploy REHEARSE_URL_PREFIX=...` stands up
# before it installs CalDART behind it with --tls existing: one HTTPS host for
# caldart.test with a self-signed certificate, serving a one-line page at /.
# The recipe copies it to /etc/apache2/sites-available/standin.conf, and the
# install inserts its Include line before the closing tag below.

<VirtualHost *:443>
    ServerName caldart.test
    DocumentRoot /var/www/standin

    SSLEngine on
    SSLCertificateFile    /etc/ssl/standin/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/standin/privkey.pem
</VirtualHost>
