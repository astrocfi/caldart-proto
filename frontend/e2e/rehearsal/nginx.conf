# The existing site `make rehearse-deploy REHEARSE_URL_PREFIX=...` stands up
# before it installs CalDART behind it with --tls existing: one HTTPS server for
# caldart.test with a self-signed certificate, serving a one-line page at /.
# The recipe copies it to /etc/nginx/sites-available/standin, and the install
# inserts its include line before the closing brace below.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caldart.test;

    ssl_certificate     /etc/ssl/standin/fullchain.pem;
    ssl_certificate_key /etc/ssl/standin/privkey.pem;

    root  /var/www/standin;
    index index.html;
}
