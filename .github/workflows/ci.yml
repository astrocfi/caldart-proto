name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

# Every check is a make target, so CI runs exactly what `make` runs locally
# (.claude/rules/environment.md).  The jobs only install what their targets need.
jobs:
  backend:
    name: Backend (lint + check + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caldart
          POSTGRES_PASSWORD: caldart
          POSTGRES_DB: caldart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caldart -d caldart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://caldart:caldart@localhost:5432/caldart
      SECRET_KEY: ci-secret-key
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint-backend

      - name: Spelling
        run: make lint-spelling

      - name: Django system checks and missing migrations
        run: make check-backend

      - name: Production deployment security check
        run: make check-deploy

      - name: Tests
        run: make test-backend

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: make lint-frontend

      - name: Tests
        run: make test-frontend

      - name: Production build
        run: make check-frontend

  audit:
    name: Audit (uv + npm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Known vulnerabilities
        run: make audit

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caldart
          POSTGRES_PASSWORD: caldart
          POSTGRES_DB: caldart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caldart -d caldart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # `make e2e` resets and seeds this database itself, and pins every
      # setting its server needs (DEBUG, SECRET_KEY, ALLOWED_HOSTS, …), so
      # this job deliberately supplies nothing but the database it creates
      # below and somewhere to put the server log.
      E2E_DATABASE_URL: postgres://caldart:caldart@localhost:5432/caldart_e2e
      DATABASE_URL: postgres://caldart:caldart@localhost:5432/caldart
      E2E_LOG: ${{ github.workspace }}/e2e-server.log

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --frozen
          cd frontend && npm ci

      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Create the end-to-end database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE caldart_e2e OWNER caldart'
        env:
          PGPASSWORD: caldart

      - name: Run the five flows
        run: make e2e SKIP_CREATEDB=1

      - name: Show the Django log
        if: failure()
        run: tail -200 "$E2E_LOG" || true

      - name: Upload the report when a flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The HTML report, plus the traces and screenshots it links to, plus
          # the server's own log: enough to see what the browser and Django
          # each did without reproducing the run.
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-server.log
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: Docs (sphinx -n -W)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build documentation
        run: make docs
