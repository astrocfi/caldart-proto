# Unit: tests-reminders
"backend/tests/test_reminders.py" = ["ANN", "D"]
"backend/tests/test_reminders_api.py" = ["ANN", "D"]
"backend/tests/test_reminders_resilience.py" = ["ANN", "D"]
# Unit: tests-cms
"backend/tests/test_cms_documents.py" = ["ANN", "D"]
"backend/tests/test_cms_pages.py" = ["ANN", "D"]
"backend/tests/test_cms_permissions.py" = ["ANN", "D"]
"backend/tests/test_cms_seed_content.py" = ["ANN", "D"]
"backend/tests/test_shell_views.py" = ["ANN", "D"]
"backend/tests/test_site_config.py" = ["ANN", "D"]
