[project]
name = "caldart"
version = "0.1.0"
description = "CalDART website and member management system (prototype)"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "wagtail>=8.0",
    "djangorestframework>=3.18",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-vite>=3.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "stripe>=11.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "faker>=30.0",
    "django-csp>=4.0",
    "drf-spectacular>=0.28",
]

[dependency-groups]
# The Sphinx toolchain is its own group because production installs it: the
# user guide is built on the server and served at /docs/ (see
# docs/developer/deployment.rst).  `dev` includes it, so `uv sync` still
# installs everything a checkout needs.
docs = [
    "sphinx>=8.0",
    "furo>=2024.8.6",
]
dev = [
    { include-group = "docs" },
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.15",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "respx>=0.21",
    "codespell>=2.4.3",
    "ruff>=0.7",
    "mypy>=2.3.1",
    "django-stubs[compatible-mypy]>=6.1.1",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "types-reportlab>=5.0.0.20260911",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "caldart.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Wagtail generates an image rendition through a SpooledTemporaryFile it
    # never closes explicitly (wagtail/images/models.py), so the file reaches the
    # garbage collector open.  The warning comes from the library, not from our
    # code, and only fires on the pages that render an image.
    "default:Unclosed file:ResourceWarning",
]
markers = [
    "slow: seeds the whole demo data set; excluded by `-m \"not slow\"`",
    "needs_frontend_build: skipped unless frontend/dist carries a real Vite build",
]

[tool.coverage.run]
branch = true
source = ["backend/apps", "backend/caldart"]
omit = ["*/migrations/*", "backend/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.codespell]
# `en-GB_to_en-US` enforces the American spelling rule; `clear,rare` catch typos.
builtin = "clear,rare,en-GB_to_en-US"
# `.codespell-dictionary.txt` adds British words the builtins above miss (e.g.
# `aeroplane`, `cheque`); the trailing `-` keeps those builtins in force. (Listed in
# this order because codespell's TOML loader passes the whole comma-separated string
# as one argv token, and a leading `-` alone is misparsed as an unrecognized option.)
dictionary = ".codespell-dictionary.txt,-"
# `.claude/worktrees` holds nested checkouts of this repository, each with its own
# build output and its own copy of `plans/`; none of it belongs to this tree's sources.
# `backend/openapi.json`, `frontend/src/portal/api/schema.d.ts` and the OpenAPI
# component snapshot are generated into trees this lint scans, so skipping them keeps
# the result the same whether or not a build step has run -- and a generated file
# cannot carry a `codespell:ignore` comment for a word like the state code `ND`.
# `frontend/e2e/seed-facts.json` is written by `make e2e` from the seeded database,
# and carries whatever names Faker drew.
# `backend/htmlcov` is `make coverage-backend`'s report.
skip = "*.lock,package-lock.json,*.svg,*.png,*.woff2,node_modules,.venv,docs/_build,frontend/dist,backend/staticfiles,backend/htmlcov,.claude/worktrees,backend/openapi.json,frontend/src/portal/api/schema.d.ts,backend/tests/snapshots/openapi-components.json,frontend/e2e/seed-facts.json"
# nnumber: the nNumber identifier, which spells the FAA N-number in camelCase.
# unparseable: a valid American spelling that the `rare` dictionary flags.
# Anything else stays reportable: silence a single line with a trailing
# `codespell:ignore <word>` comment instead of widening this list.
ignore-words-list = "nnumber,unparseable"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
src = ["backend"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "DJ", "C4", "W", "ANN", "D",
    "A", "N", "RUF", "SIM", "PT", "PTH", "RET", "PERF", "ERA", "T20", "S",
]
# D104: a package's __init__.py needs no docstring.
# D106: a model's or serializer's nested Meta class needs no docstring.
# RUF012: Django's Meta options, admin list_display lists and serializer fields are
# class-level configuration the framework reads and nothing mutates, so ClassVar would
# document nothing.
ignore = ["B008", "DJ001", "D104", "D106", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is pytest's assertion mechanism.
"backend/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["caldart", "apps"]

[tool.ruff.lint.flake8-annotations]
# `*args` and `**kwargs` forwarded to an untyped Django or DRF base may be `Any`.
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# Enables W505, which wraps docstrings and comments at the width python.md asks for.
max-doc-length = 90

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
# Wagtail's page, block and settings base classes are untyped, so every model that
# subclasses one would otherwise be an error rather than a checked class.
disallow_subclassing_any = false
exclude = ["/migrations/"]
untyped_calls_exclude = ["factory"]

[tool.django-stubs]
django_settings_module = "caldart.settings.test"

# Dependencies that ship no type information and have no stubs on PyPI.  The last
# four are Wagtail's own dependencies, which its models reach through when the
# django-stubs plugin loads the app registry.
[[tool.mypy.overrides]]
module = [
    "wagtail.*",
    "environ.*",
    "django_filters.*",
    "django_vite.*",
    "whitenoise.*",
    "modelcluster.*",
    "modelsearch.*",
    "taggit.*",
    "treebeard.*",
]
ignore_missing_imports = true

# factory_boy ships py.typed but re-exports its declarative API from ``factory`` without
# ``as`` aliases, and leaves that API unannotated.  Accepting the re-exports here, and
# the untyped calls through ``untyped_calls_exclude`` above, keeps its source followed,
# so a factory's declared model type still reaches every caller.
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true


