"backend/tests/test_aircraft_exports.py" = ["ANN", "D"]
"backend/tests/test_aircraft_models.py" = ["ANN", "D"]
"backend/tests/test_profile_aircraft_api.py" = ["ANN", "D"]
# Unit: tests-payments
"backend/tests/test_payment_report_query.py" = ["ANN", "D"]
