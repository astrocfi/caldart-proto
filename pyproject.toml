[project]
name = "caldart"
version = "0.1.0"
description = "CalDART website and member management system (prototype)"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    # The <6.0 bound stays until a follow-up moves the lock to Django 6, runs every
    # gate and the end-to-end suite against it, and drops the bound in the same PR.
    "django>=5.2,<6.0",
    "wagtail>=8.0",
    "djangorestframework>=3.18",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-vite>=3.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "stripe>=11.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "respx>=0.21",
    "codespell>=2.4.3",
    "ruff>=0.7",
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "mypy>=2.3.1",
    "django-stubs[compatible-mypy]>=6.1.1",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "types-reportlab>=5.0.0.20260911",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "caldart.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # WhiteNoise warns when STATIC_ROOT (backend/staticfiles/) has not been collected.
    # The suite never runs collectstatic, so the warning describes the checkout, not
    # the code.  WhiteNoise attributes it to its caller (stacklevel=3), so the filter
    # matches the message rather than a module.
    "ignore:No directory at:UserWarning",
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American spelling rule; `clear,rare` catch typos.
builtin = "clear,rare,en-GB_to_en-US"
# `.codespell-dictionary.txt` adds British words the builtins above miss (e.g.
# `aeroplane`, `cheque`); the trailing `-` keeps those builtins in force. (Listed in
# this order because codespell's TOML loader passes the whole comma-separated string
# as one argv token, and a leading `-` alone is misparsed as an unrecognized option.)
dictionary = ".codespell-dictionary.txt,-"
# `.claude/worktrees` holds nested checkouts of this repository, each with its own
# build output and its own copy of `plans/`; none of it belongs to this tree's sources.
skip = "*.lock,package-lock.json,*.svg,*.png,*.woff2,node_modules,.venv,docs/_build,frontend/dist,backend/staticfiles,.claude/worktrees"
# nnumber: the nNumber identifier, which spells the FAA N-number in camelCase.
# unparseable: a valid American spelling that the `rare` dictionary flags.
# Anything else stays reportable: silence a single line with a trailing
# `codespell:ignore <word>` comment instead of widening this list.
ignore-words-list = "nnumber,unparseable"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "W", "ANN", "D"]
# D104: a package's __init__.py needs no docstring.
# D106: a model's or serializer's nested Meta class needs no docstring.
ignore = ["B008", "DJ001", "D104", "D106"]

[tool.ruff.lint.isort]
known-first-party = ["caldart", "apps"]

[tool.ruff.lint.flake8-annotations]
# `*args` and `**kwargs` forwarded to an untyped Django or DRF base may be `Any`.
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# Enables W505, which wraps docstrings and comments at the width python.md asks for.
max-doc-length = 90

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
# Wagtail's page, block and settings base classes are untyped, so every model that
# subclasses one would otherwise be an error rather than a checked class.
disallow_subclassing_any = false
exclude = ["/migrations/"]
untyped_calls_exclude = ["factory"]

[tool.django-stubs]
django_settings_module = "caldart.settings.test"

# Dependencies that ship no type information and have no stubs on PyPI.  The last
# four are Wagtail's own dependencies, which its models reach through when the
# django-stubs plugin loads the app registry.
[[tool.mypy.overrides]]
module = [
    "wagtail.*",
    "environ.*",
    "django_filters.*",
    "django_vite.*",
    "whitenoise.*",
    "modelcluster.*",
    "modelsearch.*",
    "taggit.*",
    "treebeard.*",
]
ignore_missing_imports = true

# factory_boy ships py.typed but re-exports its declarative API from ``factory`` without
# ``as`` aliases, and leaves that API unannotated.  Accepting the re-exports here, and
# the untyped calls through ``untyped_calls_exclude`` above, keeps its source followed,
# so a factory's declared model type still reaches every caller.
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true


