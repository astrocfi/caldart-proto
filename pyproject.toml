[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
# Wagtail's page, block and settings base classes are untyped, so every model that
# subclasses one would otherwise be an error rather than a checked class.
disallow_subclassing_any = false
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "caldart.settings.test"

# Dependencies that ship no type information and have no stubs on PyPI.
[[tool.mypy.overrides]]
module = [
    "wagtail.*",
    "environ.*",
    "django_filters.*",
    "django_vite.*",
    "whitenoise.*",
    "taggit.*",
    "modelcluster.*",
    "modelsearch.*",
    "treebeard.*",
]
ignore_missing_imports = true

# The type-checking ratchet, unit by unit, matching the ruff table above.  Each
# unit's own change deletes its override; none may remain once every unit is typed.
# Unit: sysadmin
[[tool.mypy.overrides]]
module = ["apps.sysadmin.*"]
ignore_errors = true

# Unit: aircraft
[[tool.mypy.overrides]]
module = ["apps.aircraft.*"]
ignore_errors = true

# Unit: payments
[[tool.mypy.overrides]]
module = ["apps.payments.*"]
ignore_errors = true

# Unit: accounts
[[tool.mypy.overrides]]
module = ["apps.accounts.*"]
ignore_errors = true

# Unit: cms
[[tool.mypy.overrides]]
module = ["apps.cms.*"]
ignore_errors = true

# Unit: members
[[tool.mypy.overrides]]
module = ["apps.members.*"]
ignore_errors = true

# Unit: tests-accounts
[[tool.mypy.overrides]]
module = [
    "tests.test_account_edit_guard",
    "tests.test_account_services",
    "tests.test_accounts_auth",
    "tests.test_auth_api",
    "tests.test_auth_throttle_ident",
