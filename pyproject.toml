[project]
name = "caldart"
version = "0.1.0"
description = "CalDART website and member management system (prototype)"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "wagtail>=6.3",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-vite>=3.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "stripe>=11.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "respx>=0.21",
    "codespell>=2.4.3",
    "ruff>=0.7",
    "sphinx>=8.0",
    "furo>=2024.8.6",
    "mypy>=2.3.1",
    "django-stubs[compatible-mypy]>=6.1.1",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "types-reportlab>=5.0.0.20260911",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "caldart.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # WhiteNoise warns when STATIC_ROOT (backend/staticfiles/) has not been collected.
    # The suite never runs collectstatic, so the warning describes the checkout, not
    # the code.  WhiteNoise attributes it to its caller (stacklevel=3), so the filter
    # matches the message rather than a module.
    "ignore:No directory at:UserWarning",
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American spelling rule; `clear,rare` catch typos.
builtin = "clear,rare,en-GB_to_en-US"
# `.codespell-dictionary.txt` adds British words the builtins above miss (e.g.
# `aeroplane`, `cheque`); the trailing `-` keeps those builtins in force. (Listed in
# this order because codespell's TOML loader passes the whole comma-separated string
# as one argv token, and a leading `-` alone is misparsed as an unrecognized option.)
dictionary = ".codespell-dictionary.txt,-"
# `.claude/worktrees` holds nested checkouts of this repository, each with its own
# build output and its own copy of `plans/`; none of it belongs to this tree's sources.
skip = "*.lock,package-lock.json,*.svg,*.png,*.woff2,node_modules,.venv,docs/_build,frontend/dist,backend/staticfiles,.claude/worktrees"
# nnumber: the nNumber identifier, which spells the FAA N-number in camelCase.
# unparseable: a valid American spelling that the `rare` dictionary flags.
# Anything else stays reportable: silence a single line with a trailing
# `codespell:ignore <word>` comment instead of widening this list.
ignore-words-list = "nnumber,unparseable"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "W", "ANN", "D"]
# D104: a package's __init__.py needs no docstring.
# D106: a model's or serializer's nested Meta class needs no docstring.
ignore = ["B008", "DJ001", "D104", "D106"]

[tool.ruff.lint.isort]
known-first-party = ["caldart", "apps"]

[tool.ruff.lint.flake8-annotations]
# `*args` and `**kwargs` forwarded to an untyped Django or DRF base may be `Any`.
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# Enables W505, which wraps docstrings and comments at the width python.md asks for.
max-doc-length = 90

# The annotation and docstring ratchet.  Each entry below suspends ANN and D for one
# unit of the backend; the unit's own change deletes its entry and never adds one.
# No entry may remain once every unit is annotated and documented.
[tool.ruff.lint.per-file-ignores]
# Unit: sysadmin
"backend/apps/sysadmin/**" = ["ANN", "D"]
# Unit: aircraft
"backend/apps/aircraft/**" = ["ANN", "D"]
# Unit: payments
"backend/apps/payments/**" = ["ANN", "D"]
# Unit: accounts
"backend/apps/accounts/**" = ["ANN", "D"]
# Unit: cms
"backend/apps/cms/**" = ["ANN", "D"]
# Unit: members
"backend/apps/members/**" = ["ANN", "D"]
# Unit: tests-accounts
"backend/tests/test_account_edit_guard.py" = ["ANN", "D"]
"backend/tests/test_account_services.py" = ["ANN", "D"]
"backend/tests/test_accounts_auth.py" = ["ANN", "D"]
"backend/tests/test_auth_api.py" = ["ANN", "D"]
"backend/tests/test_auth_throttle_ident.py" = ["ANN", "D"]
"backend/tests/test_auth_throttle_rates.py" = ["ANN", "D"]
"backend/tests/test_csrf.py" = ["ANN", "D"]
"backend/tests/test_profile_api.py" = ["ANN", "D"]
"backend/tests/test_roles_permissions.py" = ["ANN", "D"]
"backend/tests/test_users_admin_api.py" = ["ANN", "D"]
# Unit: tests-members
"backend/tests/test_leader_api.py" = ["ANN", "D"]
"backend/tests/test_member_invitation.py" = ["ANN", "D"]
"backend/tests/test_member_services.py" = ["ANN", "D"]
"backend/tests/test_members_admin.py" = ["ANN", "D"]
"backend/tests/test_members_admin_status.py" = ["ANN", "D"]
"backend/tests/test_members_delete_payments.py" = ["ANN", "D"]
"backend/tests/test_members_expiring_within.py" = ["ANN", "D"]
"backend/tests/test_members_reports.py" = ["ANN", "D"]
"backend/tests/test_membership_query_counts.py" = ["ANN", "D"]
"backend/tests/test_membership_services.py" = ["ANN", "D"]
# Unit: tests-aircraft
