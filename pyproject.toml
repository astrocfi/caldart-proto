[project]
name = "caldart"
version = "0.1.0"
description = "CalDART website and member management system (prototype)"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "wagtail>=6.3",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "django-vite>=3.0",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "stripe>=11.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "faker>=30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "respx>=0.21",
    "codespell>=2.4.3",
    "ruff>=0.7",
    "sphinx>=8.0",
    "furo>=2024.8.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "caldart.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # WhiteNoise warns when STATIC_ROOT (backend/staticfiles/) has not been collected.
    # The suite never runs collectstatic, so the warning describes the checkout, not
    # the code.  WhiteNoise attributes it to its caller (stacklevel=3), so the filter
    # matches the message rather than a module.
    "ignore:No directory at:UserWarning",
]

[tool.codespell]
# `en-GB_to_en-US` enforces the American spelling rule; `clear,rare` catch typos.
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.lock,package-lock.json,*.svg,*.png,*.woff2,node_modules,.venv,docs/_build,frontend/dist,backend/staticfiles"
# nnumber: the nNumber identifier, which spells the FAA N-number in camelCase.
# unparseable: a valid American spelling that the `rare` dictionary flags.
# afterall: Vitest's afterAll hook.  onother: the onOther callback prop, named
# for the "Other amount" choice it reports.
ignore-words-list = "nnumber,unparseable,afterall,onother"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "W"]
ignore = ["B008", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["caldart", "apps"]
