# CalDART -- Apache 2.4 snippet that serves the site under a URL prefix inside
# the vhost of a site this machine already serves over HTTPS.
#
# deploy/steps/web-server.sh installs it with --tls existing, rendered to
# /etc/apache2/conf-available/caldart.conf with __PREFIX__ replaced by the URL
# prefix (such as /caldart-proto, or nothing for the root of the host) and
# /opt/caldart by the deploy root.  It is not enabled with a2enconf, which
# would load it for every host: the existing site's vhost includes it, inside
# its <VirtualHost *:443> block, with the one line
#
#     Include conf-available/caldart.conf
#
# The existing site terminates TLS, so this snippet names no certificate.  The
# proxy strips the prefix before gunicorn sees the request, and Django's
# FORCE_SCRIPT_NAME (URL_PREFIX in /etc/caldart/caldart.env) puts it back on
# every URL it writes.  SITE_URL there is https://caldart.example.org__PREFIX__.
#
# Static files are not aliased: whitenoise serves them through the proxy.  Only
# the prefix's media/ -- Wagtail's user uploads -- is served straight off disk,
# as deploy/apache/caldart.conf does for a site with a host of its own.

# The prefix without its slash is a directory's name; send it to the site.
RedirectMatch 301 "^__PREFIX__$" "__PREFIX__/"

# --- Media: Wagtail image uploads served straight off disk -----------------
Alias "__PREFIX__/media/" "/opt/caldart/backend/media/"
<Directory "/opt/caldart/backend/media">
    Require all granted
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride None

    # Uploads keep their filenames, so cache for a week rather than forever.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresDefault "access plus 1 week"
    </IfModule>

    # Never let an uploaded file be interpreted as a script.
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    RemoveHandler .php .phtml .pl .py .cgi
    Header set X-Content-Type-Options "nosniff"
</Directory>

# A document in the Members only collection is served only to members, by
# Django's document view, so the files must not be readable from disk.
<Directory "/opt/caldart/backend/media/documents">
    Require all denied
</Directory>
# Must come before the ProxyPass below, or the proxy would win.
ProxyPass "__PREFIX__/media/" "!"

# --- Reverse proxy to gunicorn ----------------------------------------------
# Scoped to the prefix, so the existing site's own requests keep their headers.
<Location "__PREFIX__/">
    ProxyPreserveHost On

    # Tell Django the request arrived over TLS.  prod.py reads this via
    # SECURE_PROXY_SSL_HEADER; gunicorn only trusts these headers from
    # 127.0.0.1 (forwarded_allow_ips), so a client cannot spoof them.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    RequestHeader unset X-Forwarded-Ssl

    # Wagtail image and document uploads; keep in step with the nginx snippet.
    LimitRequestBody 26214400
</Location>

ProxyPass "__PREFIX__/" "http://127.0.0.1:8001/" retry=0 timeout=60
ProxyPassReverse "__PREFIX__/" "http://127.0.0.1:8001/"

<Proxy "http://127.0.0.1:8001/">
    Require all granted
</Proxy>
