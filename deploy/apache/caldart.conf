# CalDART -- Apache 2.4 reverse proxy in front of gunicorn (PLAN.rst §13).
#
# Deploy path: /srv/caldart. gunicorn listens on 127.0.0.1:8001 under
# deploy/systemd/caldart-web.service; Apache terminates TLS and proxies to it.
#
# Required modules:
#   sudo a2enmod proxy proxy_http headers ssl rewrite deflate expires http2
#   sudo a2ensite caldart
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# TLS certificates come from certbot:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d caldart.example.org -d www.caldart.example.org
#
# Replace caldart.example.org with the real hostname; it must also appear in
# ALLOWED_HOSTS, and the https:// form in CSRF_TRUSTED_ORIGINS, in
# /etc/caldart/caldart.env (PLAN.rst §14).
#
# Static files are NOT aliased here. Django serves /static/ through whitenoise
# (PLAN.rst §2), which sets far-future cache headers on the hashed filenames
# collectstatic produces and behaves identically in dev and behind this proxy.
# Aliasing /static/ would bypass whitenoise's manifest and break those hashes.
# Only /media/ -- Wagtail's user uploads, which are not hashed -- is served
# directly by Apache below.

# --- Port 80: ACME challenges, everything else redirected to HTTPS ----------

<VirtualHost *:80>
    ServerName caldart.example.org
    ServerAlias www.caldart.example.org

    # Let certbot renew over HTTP without bouncing the challenge to HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge">
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L,NE]

    ErrorLog  ${APACHE_LOG_DIR}/caldart-http-error.log
    CustomLog ${APACHE_LOG_DIR}/caldart-http-access.log combined
</VirtualHost>

# --- Port 443: the application ---------------------------------------------

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName caldart.example.org
    ServerAlias www.caldart.example.org
    ServerAdmin webmaster@caldart.example.org

    Protocols h2 http/1.1

    # --- TLS (certbot layout) ---------------------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/caldart.example.org/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/caldart.example.org/privkey.pem
    # Modern protocol and cipher defaults, shipped by certbot's apache plugin.
    Include /etc/letsencrypt/options-ssl-apache.conf

    # HSTS. Only enable once HTTPS is known good on every hostname served here.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- Security headers --------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Django sets X-Frame-Options itself; leave it to the app so the Wagtail
    # admin's page previews keep working.

    # --- Media: Wagtail uploads served straight off disk -------------------
    # Cheaper than round-tripping through gunicorn, and these files are public
    # by design. Must be listed before ProxyPass so it wins.
    Alias /media/ /srv/caldart/backend/media/
    <Directory "/srv/caldart/backend/media">
        Require all granted
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride None

        # Uploads keep their filenames, so cache for a week rather than
        # forever; a re-upload under the same name must not stick.
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 1 week"
        </IfModule>

        # Never let an uploaded file be interpreted as a script.
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .pl .py .cgi
        Header set X-Content-Type-Options "nosniff"
    </Directory>
    ProxyPass /media/ !

    # --- Reverse proxy to gunicorn ----------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # Tell Django the request arrived over TLS. prod.py reads this via
    # SECURE_PROXY_SSL_HEADER (PLAN.rst §13); gunicorn only trusts these
    # headers from 127.0.0.1 (forwarded_allow_ips), so they cannot be spoofed
    # by a client.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    # Drop any inbound copy of the scheme header before we set our own.
    RequestHeader unset X-Forwarded-Ssl

    ProxyPass        / http://127.0.0.1:8001/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8001/

    <Proxy "http://127.0.0.1:8001/">
        Require all granted
    </Proxy>

    # --- Uploads -----------------------------------------------------------
    # Wagtail image and document uploads; keep in step with nginx's
    # client_max_body_size and with any DATA_UPLOAD_MAX_MEMORY_SIZE in prod.py.
    LimitRequestBody 26214400

    # --- Compression -------------------------------------------------------
    # whitenoise already ships pre-compressed static assets; this covers the
    # HTML and JSON coming back from gunicorn.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
            application/javascript application/json application/xml image/svg+xml
    </IfModule>

    # --- Logging -----------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/caldart-error.log
    CustomLog ${APACHE_LOG_DIR}/caldart-access.log combined
    LogLevel warn
</VirtualHost>
</IfModule>
