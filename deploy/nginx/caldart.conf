# CalDART -- nginx reverse proxy in front of gunicorn.
#
# The alternative to deploy/apache/caldart.conf; use one or the other, never
# both on the same host. Deploy path: /srv/caldart. gunicorn listens on
# 127.0.0.1:8001 under deploy/systemd/caldart-web.service.
#
# Install:
#   sudo cp deploy/nginx/caldart.conf /etc/nginx/sites-available/caldart
#   sudo ln -s /etc/nginx/sites-available/caldart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates come from certbot:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d caldart.example.org -d www.caldart.example.org
#
# Replace caldart.example.org with the real hostname; it must also appear in
# ALLOWED_HOSTS, and the https:// form in CSRF_TRUSTED_ORIGINS, in
# /etc/caldart/caldart.env.
#
# gzip: the stock Debian/Ubuntu nginx.conf already enables gzip for text/html.
# If yours does not, or you want JSON and CSS covered too, add to the http
# block (not here -- gzip_types is only valid at http/server/location level and
# is set once globally):
#     gzip on;
#     gzip_vary on;
#     gzip_proxied any;
#     gzip_min_length 1024;
#     gzip_types text/plain text/css application/json application/javascript
#                text/xml application/xml image/svg+xml;
# whitenoise already serves pre-compressed static assets, so /static/ needs
# nothing here.

upstream caldart_app {
    # Loopback only; the app server is never exposed directly.
    server 127.0.0.1:8001 fail_timeout=0;

    # Reuse connections to gunicorn instead of reconnecting per request.
    keepalive 16;
}

# --- Port 80: ACME challenges, everything else redirected to HTTPS ----------

server {
    listen      80;
    listen      [::]:80;
    server_name caldart.example.org www.caldart.example.org;

    # Let certbot renew over HTTP without bouncing the challenge to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/caldart-http-access.log;
    error_log  /var/log/nginx/caldart-http-error.log warn;
}

# --- Port 443: the application ---------------------------------------------

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name caldart.example.org www.caldart.example.org;

    # --- TLS (certbot layout) ---------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/caldart.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caldart.example.org/privkey.pem;
    # Modern protocol and cipher defaults, shipped by certbot's nginx plugin.
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. Only enable once HTTPS is known good on every hostname served here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Django sets X-Frame-Options itself; leave it to the app so the Wagtail
    # admin's page previews keep working.

    # Wagtail image and document uploads; keep in step with Apache's
    # LimitRequestBody and with any DATA_UPLOAD_MAX_MEMORY_SIZE in prod.py.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # --- Media: Wagtail uploads served straight off disk -------------------
    # /static/ is deliberately absent: whitenoise serves it through the proxy
    # so the hashed filenames from collectstatic keep working.
    location /media/ {
        alias /srv/caldart/backend/media/;

        # Uploads keep their filenames, so cache for a week rather than
        # forever; a re-upload under the same name must not stick.
        expires 1w;
        add_header Cache-Control     "public";
        add_header X-Content-Type-Options "nosniff" always;

        autoindex off;
        access_log off;
        try_files $uri =404;
    }

    # --- Reverse proxy to gunicorn ----------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8001;

        # Django needs the original host and scheme: prod.py reads the scheme
        # via SECURE_PROXY_SSL_HEADER, and gunicorn only trusts
        # these headers from 127.0.0.1 (forwarded_allow_ips), so a client
        # cannot spoof them.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Matches gunicorn's 60s worker timeout, with enough room for a large
        # filtered PDF report.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Let gunicorn's own error pages through unchanged.
        proxy_redirect     off;
        proxy_buffering    on;
        proxy_buffers      16 16k;
        proxy_busy_buffers_size 32k;
    }

    # --- Logging -----------------------------------------------------------
    access_log /var/log/nginx/caldart-access.log;
    error_log  /var/log/nginx/caldart-error.log warn;
}
