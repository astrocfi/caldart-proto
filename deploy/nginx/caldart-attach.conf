# CalDART -- nginx snippet that serves the site under a URL prefix inside the
# server block of a site this machine already serves over HTTPS.
#
# deploy/steps/web-server.sh installs it with --tls existing, rendered to
# /etc/nginx/snippets/caldart.conf with __PREFIX__ replaced by the URL prefix
# (such as /caldart-proto, or nothing for the root of the host) and
# /opt/caldart by the deploy root.  The existing site's server block (the one
# with `listen 443 ssl`) includes it with the one line
#
#     include snippets/caldart.conf;
#
# The upstream it proxies to, caldart_app, is defined once in
# /etc/nginx/conf.d/caldart-upstream.conf (deploy/nginx/caldart-upstream.conf).
#
# The existing site terminates TLS, so this snippet names no certificate.  The
# proxy strips the prefix before gunicorn sees the request, and Django's
# FORCE_SCRIPT_NAME (URL_PREFIX in /etc/caldart/caldart.env) puts it back on
# every URL it writes.  SITE_URL there is https://caldart.example.org__PREFIX__.
# Every location is ^~, so no regular-expression location of the existing site
# (a `location ~ \.php$`, say) takes a request under the prefix.

# The prefix without its slash is a directory's name; send it to the site.
location ~ ^__PREFIX__$ {
    return 301 __PREFIX__/;
}

# A document in the Members only collection is served only to members, by
# Django's document view, so the files stay unreachable here.
location ^~ __PREFIX__/media/documents/ {
    return 404;
}

# Wagtail image uploads, served straight off disk.  Static files are not
# listed: whitenoise serves them through the proxy.
location ^~ __PREFIX__/media/ {
    alias /opt/caldart/media/;

    # Uploads keep their filenames, so cache for a week rather than forever.
    expires 1w;
    add_header Cache-Control     "public";
    add_header X-Content-Type-Options "nosniff" always;

    autoindex off;
    access_log off;
    try_files $uri =404;
}

location ^~ __PREFIX__/ {
    # The URI on proxy_pass replaces the matched prefix: gunicorn sees /...
    proxy_pass http://caldart_app/;

    # Wagtail image and document uploads; keep in step with the Apache snippet.
    client_max_body_size 25m;
    client_body_timeout  60s;

    # Django needs the original host and scheme: prod.py reads the scheme via
    # SECURE_PROXY_SSL_HEADER, and gunicorn only trusts these headers from
    # 127.0.0.1 (forwarded_allow_ips), so a client cannot spoof them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    # gunicorn also reads these two as the scheme; a client's own would
    # contradict X-Forwarded-Proto and draw a 400, so send them empty (dropped).
    proxy_set_header X-Forwarded-Ssl   "";
    proxy_set_header X-Forwarded-Protocol "";

    proxy_http_version 1.1;
    proxy_set_header   Connection "";

    # Matches gunicorn's 60s worker timeout.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_redirect     off;
    proxy_buffering    on;
    proxy_buffers      16 16k;
    proxy_busy_buffers_size 32k;
}
