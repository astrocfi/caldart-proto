# CalDART -- the gunicorn upstream the nginx snippet proxies to.
#
# deploy/steps/web-server.sh installs it with --tls existing, as
# /etc/nginx/conf.d/caldart-upstream.conf, which nginx.conf loads once into its
# http block.  It lives apart from deploy/nginx/caldart-attach.conf because
# that snippet is included inside a server block, possibly more than once, and
# an upstream may be defined only once.  Deploy root: /opt/caldart; the site is
# https://caldart.example.org__PREFIX__.  The installer writes the port
# install.sh --gunicorn-port recorded into gunicorn's address below.

upstream caldart_app {
    # Loopback only; the app server is never exposed directly.
    server 127.0.0.1:8001 fail_timeout=0;

    # Reuse connections to gunicorn instead of reconnecting per request.
    keepalive 16;
}
